id: mailpit
name: Mailpit
version: "1.0"
description: Email testing tool with a modern web UI — catch outgoing mail from your apps via SMTP
icon: https://cdn.jsdelivr.net/gh/jhd3197/serverkit-templates@master/icons/mailpit.svg
website: https://mailpit.axllent.org
documentation: https://mailpit.axllent.org/docs/
categories:
  - development
  - email

variables:
  - name: HTTP_PORT
    description: Port for the Mailpit web UI (auto-assigned)
    type: port
    default: "8025"
    hidden: true
  - name: SMTP_PORT
    description: SMTP port your apps send mail to
    default: "1025"

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: Mailpit Web UI
  - port: "${SMTP_PORT}"
    protocol: tcp
    description: SMTP

requirements:
  memory: 128MB
  storage: 1GB

compose:
  services:
    mailpit:
      image: axllent/mailpit:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:8025"
        - "${SMTP_PORT}:1025"
      environment:
        MP_DATABASE: /data/mailpit.db
      volumes:
        - mailpit-data:/data
  volumes:
    mailpit-data:

post_install: |
  Mailpit is running at http://your-server:${HTTP_PORT}

  - Point your apps' SMTP settings at this server, port ${SMTP_PORT}; every
    message is captured and shown in the web UI instead of being delivered.
