id: dokuwiki
name: DokuWiki
version: "1.0"
description: Simple, versatile wiki that needs no database — clean syntax and easy file-based backups
icon: data:image/svg+xml;base64,
website: https://www.dokuwiki.org
documentation: https://www.dokuwiki.org/manual
categories:
  - documents
  - wiki

variables:
  - name: HTTP_PORT
    description: Port for the DokuWiki site (auto-assigned)
    type: port
    default: "8110"
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: DokuWiki site

requirements:
  memory: 256MB
  storage: 1GB

compose:
  services:
    dokuwiki:
      image: lscr.io/linuxserver/dokuwiki:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:80"
      environment:
        PUID: "1000"
        PGID: "1000"
        TZ: "Etc/UTC"
      volumes:
        - dokuwiki-config:/config
  volumes:
    dokuwiki-config:

post_install: |
  DokuWiki is running at http://your-server:${HTTP_PORT}

  - Visit /install.php once to create the admin account and configure the
    wiki, then start writing.
