id: drawio
name: draw.io
version: "1.0"
description: Self-hosted diagrams.net — flowcharts, network diagrams, UML, and whiteboards in the browser
icon: https://cdn.jsdelivr.net/gh/jhd3197/serverkit-templates@master/icons/drawio.svg
website: https://www.drawio.com
documentation: https://github.com/jgraph/docker-drawio#readme
categories:
  - productivity
  - diagrams

variables:
  - name: HTTP_PORT
    description: Port for the draw.io web UI (auto-assigned)
    type: port
    default: "8111"
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: draw.io Web UI

requirements:
  memory: 512MB
  storage: 1GB

compose:
  services:
    drawio:
      image: jgraph/drawio:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:8080"
  volumes: {}

post_install: |
  draw.io is running at http://your-server:${HTTP_PORT}

  - Diagrams are saved to your device or connected cloud storage — the server
    itself is stateless.
