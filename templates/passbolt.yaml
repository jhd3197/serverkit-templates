id: passbolt
name: Passbolt
version: "1.0"
description: Open-source password manager built for team collaboration, with browser extensions and granular sharing
icon: https://cdn.jsdelivr.net/gh/jhd3197/serverkit-templates@master/icons/passbolt.svg
website: https://www.passbolt.com
documentation: https://www.passbolt.com/docs
categories:
  - security
  - passwords

variables:
  - name: HTTP_PORT
    description: Port for the Passbolt web UI (auto-assigned)
    type: port
    default: "8106"
    hidden: true
  - name: DB_PASSWORD
    description: MariaDB password
    type: password
    generate: password
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: Passbolt Web UI

requirements:
  memory: 1GB
  storage: 2GB

compose:
  services:
    passbolt:
      image: passbolt/passbolt:latest-ce
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:80"
      environment:
        APP_FULL_BASE_URL: "http://localhost:${HTTP_PORT}"
        DATASOURCES_DEFAULT_HOST: db
        DATASOURCES_DEFAULT_USERNAME: passbolt
        DATASOURCES_DEFAULT_PASSWORD: ${DB_PASSWORD}
        DATASOURCES_DEFAULT_DATABASE: passbolt
      volumes:
        - passbolt-gpg:/etc/passbolt/gpg
        - passbolt-jwt:/etc/passbolt/jwt
      depends_on:
        - db

    db:
      image: mariadb:10.11
      container_name: ${APP_NAME}-db
      restart: unless-stopped
      environment:
        MARIADB_DATABASE: passbolt
        MARIADB_USER: passbolt
        MARIADB_PASSWORD: ${DB_PASSWORD}
        MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      volumes:
        - passbolt-db:/var/lib/mysql
  volumes:
    passbolt-gpg:
    passbolt-jwt:
    passbolt-db:

post_install: |
  Passbolt is running at http://your-server:${HTTP_PORT}

  - Create the first admin user (prints a registration link):
    docker exec ${APP_NAME} su -m -c "/usr/share/php/passbolt/bin/cake passbolt register_user -u you@example.com -f First -l Last -r admin" -s /bin/sh www-data
  - Passbolt strongly recommends HTTPS in production — put it behind a
    ServerKit-managed site with SSL and update APP_FULL_BASE_URL.
