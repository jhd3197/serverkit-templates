id: victoriametrics
name: VictoriaMetrics
version: "1.0"
description: Fast, cost-effective time series database and monitoring solution — a drop-in Prometheus alternative
icon: https://cdn.jsdelivr.net/gh/jhd3197/serverkit-templates@master/icons/victoriametrics.svg
website: https://victoriametrics.com
documentation: https://docs.victoriametrics.com
categories:
  - monitoring
  - database

variables:
  - name: HTTP_PORT
    description: Port for the VictoriaMetrics API and UI (auto-assigned)
    type: port
    default: "8428"
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: VictoriaMetrics API and vmui

requirements:
  memory: 512MB
  storage: 10GB

compose:
  services:
    victoriametrics:
      image: victoriametrics/victoria-metrics:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      command: -storageDataPath=/storage -retentionPeriod=12
      ports:
        - "${HTTP_PORT}:8428"
      volumes:
        - victoriametrics-data:/storage
  volumes:
    victoriametrics-data:

post_install: |
  VictoriaMetrics is running at http://your-server:${HTTP_PORT}

  - Query UI: http://your-server:${HTTP_PORT}/vmui
  - It accepts Prometheus remote_write, InfluxDB line protocol, and more.
    Retention is set to 12 months (-retentionPeriod).
