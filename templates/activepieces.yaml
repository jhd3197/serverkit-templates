id: activepieces
name: Activepieces
version: "1.0"
description: Open-source no-code automation platform — a Zapier alternative with 280+ integrations and AI pieces
icon: data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+PHBvbHlnb24gcG9pbnRzPSIxMyAyIDMgMTQgMTIgMTQgMTEgMjIgMjEgMTAgMTIgMTAgMTMgMiIvPjwvc3ZnPg==
website: https://www.activepieces.com
documentation: https://www.activepieces.com/docs
categories:
  - productivity
  - automation

variables:
  - name: HTTP_PORT
    description: Port for the Activepieces web UI (auto-assigned)
    type: port
    default: "8080"
    hidden: true
  - name: AP_ENCRYPTION_KEY
    description: 32-character hex encryption key
    type: random
    length: 32
    hidden: true
  - name: AP_JWT_SECRET
    description: Secret for signing JWTs
    type: random
    length: 64
    hidden: true
  - name: DB_PASSWORD
    description: PostgreSQL password
    type: password
    generate: password
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: Activepieces Web UI

requirements:
  memory: 1GB
  storage: 4GB

compose:
  services:
    activepieces:
      image: activepieces/activepieces:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:80"
      environment:
        AP_FRONTEND_URL: "http://localhost:${HTTP_PORT}"
        AP_ENCRYPTION_KEY: ${AP_ENCRYPTION_KEY}
        AP_JWT_SECRET: ${AP_JWT_SECRET}
        AP_POSTGRES_HOST: db
        AP_POSTGRES_PORT: "5432"
        AP_POSTGRES_DATABASE: activepieces
        AP_POSTGRES_USERNAME: activepieces
        AP_POSTGRES_PASSWORD: ${DB_PASSWORD}
        AP_REDIS_HOST: redis
        AP_REDIS_PORT: "6379"
        AP_EXECUTION_MODE: UNSANDBOXED
      depends_on:
        - db
        - redis

    db:
      image: postgres:16-alpine
      container_name: ${APP_NAME}-db
      restart: unless-stopped
      environment:
        POSTGRES_DB: activepieces
        POSTGRES_USER: activepieces
        POSTGRES_PASSWORD: ${DB_PASSWORD}
      volumes:
        - activepieces-db:/var/lib/postgresql/data

    redis:
      image: redis:7-alpine
      container_name: ${APP_NAME}-redis
      restart: unless-stopped
      volumes:
        - activepieces-redis:/data
  volumes:
    activepieces-db:
    activepieces-redis:

post_install: |
  Activepieces is running at http://your-server:${HTTP_PORT}

  - Sign up the first account to become the admin, then start building flows.
