id: gods-eye-view
name: God's Eye View
version: "1.0"
kind: repo
description: "Spy-satellite simulator in your browser — live aircraft, ships, satellites, earthquakes, and public cameras on a photorealistic 3D globe, with AI voice control. Runs a key-brokering server: put it behind authentication and set provider budget caps before exposing it."
icon: data:image/svg+xml;base64,
website: https://github.com/bilawalsidhu/gods-eye-view
documentation: https://github.com/bilawalsidhu/gods-eye-view#readme
categories:
  - media
  - maps
  - ai

# Deployed from its Git repository (like AgentSite). Upstream ships no
# Dockerfile, so nixpacks builds the image from package.json — that is why
# app_type is `docker` and not a language name: the deploy path resolves to
# docker/flask/django/php/static only, and every one of those runs a built
# image or a document root. There is no `node` app type.
#
# The start command is NOT `vite preview`. This app's API proxying lives in
# vite.config.js dev-server middleware, and only 2 of its ~13 middlewares
# also register configurePreviewServer, so a preview build loses most live
# layers. `npm run dev` is genuinely the app's server, per upstream's README.
#
# `npm ci` over `npm install`: the repo commits package-lock.json, and ci is
# the reproducible one.
repo:
  url: https://github.com/bilawalsidhu/gods-eye-view.git
  branch: main
  service_name: gods-eye-view
  app_type: docker
  build_method: nixpacks
  port: 4173
  build_command: npm ci
  start_command: npm run dev -- --host 0.0.0.0 --port 4173
  healthcheck_path: /
  manifest_files:
    - package.json
  # GOOGLE_MAPS_API_KEY is the only required key (Map Tiles API enabled).
  # Everything else is optional and lights up extra layers.
  #
  # These are secrets in the real sense: the server brokers them on the
  # client's behalf, so anyone who can reach this service can spend them.
  # Upstream's README is blunt about it — "a LAN-visible server brokers your
  # configured API keys to anyone who can reach it" — and ServerKit puts this
  # on a public domain. Set provider-side budget caps (Google Cloud budgets,
  # OpenAI usage limits) BEFORE exposing it; the two throttles below are
  # app-level guards, not billing caps.
  env:
    - key: GOOGLE_MAPS_API_KEY
      required: true
      secret: true
    - key: GEV_RATELIMIT_GOOGLE_PER_MIN
      required: false
      secret: false
    - key: GEV_RATELIMIT_OPENAI_PER_MIN
      required: false
      secret: false
    - key: OPENSKY_AUTH_MODE
      required: false
      secret: false
    - key: CESIUM_ION_TOKEN
      required: false
      secret: true
    - key: OPENAI_API_KEY
      required: false
      secret: true
    - key: AISSTREAM_API_KEY
      required: false
      secret: true
    - key: FIRMS_MAP_KEY
      required: false
      secret: true
    - key: TOMTOM_API_KEY
      required: false
      secret: true
    - key: OPENSKY_CLIENT_ID
      required: false
      secret: false
    - key: OPENSKY_CLIENT_SECRET
      required: false
      secret: true

requirements:
  memory: 2GB
  storage: 4GB
