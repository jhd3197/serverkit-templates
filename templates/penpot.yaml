id: penpot
name: Penpot
version: "1.0"
description: Open-source design and prototyping platform for teams — the self-hosted Figma alternative
icon: data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+PHBhdGggZD0iTTE3IDNhMi44MyAyLjgzIDAgMSAxIDQgNEw3LjUgMjAuNSAyIDIybDEuNS01LjV6Ii8+PC9zdmc+
website: https://penpot.app
documentation: https://help.penpot.app/technical-guide/getting-started/
categories:
  - collaboration
  - design

variables:
  - name: HTTP_PORT
    description: Port for the Penpot web UI (auto-assigned)
    type: port
    default: "9001"
    hidden: true
  - name: PENPOT_SECRET_KEY
    description: Secret key for signing sessions
    type: password
    generate: password
    hidden: true
  - name: DB_PASSWORD
    description: PostgreSQL password
    type: password
    generate: password
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: Penpot Web UI

requirements:
  memory: 4GB
  storage: 10GB

compose:
  services:
    penpot-frontend:
      image: penpotapp/frontend:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:8080"
      environment:
        PENPOT_FLAGS: "enable-registration enable-login-with-password disable-email-verification disable-secure-session-cookies"
      volumes:
        - penpot-assets:/opt/data/assets
      depends_on:
        - penpot-backend
        - penpot-exporter

    penpot-backend:
      image: penpotapp/backend:latest
      container_name: ${APP_NAME}-backend
      restart: unless-stopped
      environment:
        PENPOT_FLAGS: "enable-registration enable-login-with-password disable-email-verification disable-secure-session-cookies"
        PENPOT_PUBLIC_URI: "http://localhost:${HTTP_PORT}"
        PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY}
        PENPOT_DATABASE_URI: "postgresql://db/penpot"
        PENPOT_DATABASE_USERNAME: penpot
        PENPOT_DATABASE_PASSWORD: ${DB_PASSWORD}
        PENPOT_REDIS_URI: "redis://valkey/0"
        PENPOT_OBJECTS_STORAGE_BACKEND: fs
        PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
        PENPOT_TELEMETRY_ENABLED: "false"
      volumes:
        - penpot-assets:/opt/data/assets
      depends_on:
        - db
        - valkey

    penpot-exporter:
      image: penpotapp/exporter:latest
      container_name: ${APP_NAME}-exporter
      restart: unless-stopped
      environment:
        PENPOT_PUBLIC_URI: "http://penpot-frontend:8080"
        PENPOT_REDIS_URI: "redis://valkey/0"
      depends_on:
        - valkey

    db:
      image: postgres:15-alpine
      container_name: ${APP_NAME}-db
      restart: unless-stopped
      environment:
        POSTGRES_DB: penpot
        POSTGRES_USER: penpot
        POSTGRES_PASSWORD: ${DB_PASSWORD}
      volumes:
        - penpot-db:/var/lib/postgresql/data

    valkey:
      image: valkey/valkey:8.1
      container_name: ${APP_NAME}-valkey
      restart: unless-stopped
  volumes:
    penpot-assets:
    penpot-db:

post_install: |
  Penpot is running at http://your-server:${HTTP_PORT}

  - Register the first account (email verification is disabled for this
    self-hosted setup). Configure SMTP later for team invitations.
