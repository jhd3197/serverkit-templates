id: mediawiki
name: MediaWiki
version: "1.0"
description: The wiki software that powers Wikipedia — battle-tested collaborative knowledge bases
icon: data:image/svg+xml;base64,
website: https://www.mediawiki.org
documentation: https://www.mediawiki.org/wiki/Manual:Contents
categories:
  - documents
  - wiki

variables:
  - name: HTTP_PORT
    description: Port for the MediaWiki site (auto-assigned)
    type: port
    default: "8109"
    hidden: true
  - name: DB_PASSWORD
    description: MariaDB password
    type: password
    generate: password
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: MediaWiki site

requirements:
  memory: 512MB
  storage: 5GB

compose:
  services:
    mediawiki:
      image: mediawiki:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:80"
      volumes:
        - mediawiki-images:/var/www/html/images
      depends_on:
        - db

    db:
      image: mariadb:11
      container_name: ${APP_NAME}-db
      restart: unless-stopped
      environment:
        MARIADB_DATABASE: mediawiki
        MARIADB_USER: mediawiki
        MARIADB_PASSWORD: ${DB_PASSWORD}
        MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      volumes:
        - mediawiki-db:/var/lib/mysql
  volumes:
    mediawiki-images:
    mediawiki-db:

post_install: |
  MediaWiki is running at http://your-server:${HTTP_PORT}

  - Run the web installer (database host "db", database "mediawiki", user
    "mediawiki", password from this install's .env). At the end, download the
    generated LocalSettings.php and copy it into the container:
    docker cp LocalSettings.php ${APP_NAME}:/var/www/html/
