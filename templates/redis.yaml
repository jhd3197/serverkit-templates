id: redis
name: Redis
version: "1.0"
description: In-memory data store for caching, queues, sessions, and pub/sub
icon: https://cdn.jsdelivr.net/gh/jhd3197/serverkit-templates@master/icons/redis.svg
website: https://redis.io
documentation: https://redis.io/docs/
categories:
  - database
  - development

variables:
  - name: DB_PORT
    description: Port Redis listens on (auto-assigned)
    type: port
    default: "6379"
    hidden: true
  - name: REDIS_PASSWORD
    description: Redis password (requirepass)
    type: password
    generate: password

ports:
  - port: "${DB_PORT}"
    protocol: tcp
    description: Redis

requirements:
  memory: 256MB
  storage: 1GB

compose:
  services:
    redis:
      image: redis:7-alpine
      container_name: ${APP_NAME}
      restart: unless-stopped
      command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
      ports:
        - "${DB_PORT}:6379"
      volumes:
        - redis-data:/data
  volumes:
    redis-data:

post_install: |
  Redis 7 is running on port ${DB_PORT} (password-protected, AOF persistence on)

  - Connect: redis://:<password>@your-server:${DB_PORT}/0
  - Pair it with the Redis Commander template for a web admin UI.
