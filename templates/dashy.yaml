id: dashy
name: Dashy
version: "1.0"
description: Self-hosted startpage with status checking, themes, widgets, and a built-in UI config editor
icon: https://serverkit.ai/imgs/template-icons/dashy.png
website: https://dashy.to
documentation: https://dashy.to/docs/
categories:
  - productivity
  - dashboard

variables:
  - name: HTTP_PORT
    description: Port for the Dashy web UI (auto-assigned)
    type: port
    default: "4000"
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: Dashy dashboard

requirements:
  memory: 512MB
  storage: 1GB

compose:
  services:
    dashy:
      image: lissy93/dashy:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:8080"
      volumes:
        - dashy-data:/app/user-data
  volumes:
    dashy-data:

post_install: |
  Dashy is running at http://your-server:${HTTP_PORT}

  - Use the interactive editor (pencil icon) to add your apps and sections.
  - Config lives in the user-data volume as conf.yml.
