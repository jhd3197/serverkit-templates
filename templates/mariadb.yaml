id: mariadb
name: MariaDB
version: "1.0"
description: Community-developed fork of MySQL — fast, stable, and drop-in compatible
icon: data:image/svg+xml;base64,
website: https://mariadb.org
documentation: https://mariadb.com/kb/en/documentation/
categories:
  - database
  - development

variables:
  - name: DB_PORT
    description: Port MariaDB listens on (auto-assigned)
    type: port
    default: "3306"
    hidden: true
  - name: MARIADB_DATABASE
    description: Initial database name
    default: "app"
  - name: MARIADB_USER
    description: Database user name
    default: "app"
  - name: MARIADB_PASSWORD
    description: Database user password
    type: password
    generate: password
  - name: MARIADB_ROOT_PASSWORD
    description: Root password
    type: password
    generate: password

ports:
  - port: "${DB_PORT}"
    protocol: tcp
    description: MariaDB

requirements:
  memory: 512MB
  storage: 5GB

compose:
  services:
    mariadb:
      image: mariadb:11
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${DB_PORT}:3306"
      environment:
        MARIADB_DATABASE: ${MARIADB_DATABASE}
        MARIADB_USER: ${MARIADB_USER}
        MARIADB_PASSWORD: ${MARIADB_PASSWORD}
        MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      volumes:
        - mariadb-data:/var/lib/mysql
  volumes:
    mariadb-data:

post_install: |
  MariaDB 11 is running on port ${DB_PORT}

  - Connect: mysql://${MARIADB_USER}:<password>@your-server:${DB_PORT}/${MARIADB_DATABASE}
  - Pair it with the phpMyAdmin template for a web admin UI.
