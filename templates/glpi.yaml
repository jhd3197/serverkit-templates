id: glpi
name: GLPI
version: "1.0"
description: Full-featured IT service management — asset inventory, helpdesk tickets, and license tracking
icon: https://cdn.jsdelivr.net/gh/jhd3197/serverkit-templates@master/icons/glpi.svg
website: https://glpi-project.org
documentation: https://glpi-project.org/documentation/
categories:
  - business
  - helpdesk
  - management

variables:
  - name: HTTP_PORT
    description: Port for the GLPI web UI (auto-assigned)
    type: port
    default: "8118"
    hidden: true
  - name: DB_PASSWORD
    description: MariaDB password
    type: password
    generate: password
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: GLPI Web UI

requirements:
  memory: 1GB
  storage: 5GB

compose:
  services:
    glpi:
      image: glpi/glpi:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:80"
      environment:
        GLPI_DB_HOST: db
        GLPI_DB_PORT: "3306"
        GLPI_DB_NAME: glpi
        GLPI_DB_USER: glpi
        GLPI_DB_PASSWORD: ${DB_PASSWORD}
      volumes:
        - glpi-config:/var/glpi/config
        - glpi-files:/var/glpi/files
        - glpi-marketplace:/var/glpi/marketplace
      depends_on:
        - db

    db:
      image: mariadb:11
      container_name: ${APP_NAME}-db
      restart: unless-stopped
      environment:
        MARIADB_DATABASE: glpi
        MARIADB_USER: glpi
        MARIADB_PASSWORD: ${DB_PASSWORD}
        MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      volumes:
        - glpi-db:/var/lib/mysql
  volumes:
    glpi-config:
    glpi-files:
    glpi-marketplace:
    glpi-db:

post_install: |
  GLPI is starting — the automatic installer runs on first boot.

  - Web UI: http://your-server:${HTTP_PORT}
  - Default accounts: glpi/glpi (admin), tech/tech, normal/normal — change or
    disable them immediately.
