id: kavita
name: Kavita
version: "1.0"
description: Fast and friendly self-hosted digital library for manga, comics, and ebooks with cross-device reading
icon: data:image/svg+xml;base64,
website: https://www.kavitareader.com
documentation: https://wiki.kavitareader.com
categories:
  - media
  - books

variables:
  - name: HTTP_PORT
    description: Port for the Kavita web UI (auto-assigned)
    type: port
    default: "5000"
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: Kavita Web UI

requirements:
  memory: 512MB
  storage: 2GB

compose:
  services:
    kavita:
      image: lscr.io/linuxserver/kavita:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:5000"
      environment:
        PUID: "1000"
        PGID: "1000"
        TZ: "Etc/UTC"
      volumes:
        - kavita-config:/config
        - kavita-library:/data
  volumes:
    kavita-config:
    kavita-library:

post_install: |
  Kavita is running at http://your-server:${HTTP_PORT}

  - Create the admin account, then add a library pointing at /data
    (the kavita-library volume).
