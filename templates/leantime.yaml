id: leantime
name: Leantime
version: "1.0"
description: Goals-oriented project management for non-project managers — built with ADHD and neurodiversity in mind
icon: data:image/svg+xml;base64,
website: https://leantime.io
documentation: https://docs.leantime.io
categories:
  - productivity
  - collaboration

variables:
  - name: HTTP_PORT
    description: Port for the Leantime web UI (auto-assigned)
    type: port
    default: "8099"
    hidden: true
  - name: SESSION_PASSWORD
    description: Session encryption secret
    type: password
    generate: password
    hidden: true
  - name: DB_PASSWORD
    description: MySQL password
    type: password
    generate: password
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: Leantime Web UI

requirements:
  memory: 1GB
  storage: 2GB

compose:
  services:
    leantime:
      image: leantime/leantime:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:8080"
      environment:
        LEAN_DB_HOST: db
        LEAN_DB_USER: leantime
        LEAN_DB_PASSWORD: ${DB_PASSWORD}
        LEAN_DB_DATABASE: leantime
        LEAN_SESSION_PASSWORD: ${SESSION_PASSWORD}
      volumes:
        - leantime-userfiles:/var/www/html/userfiles
        - leantime-public-userfiles:/var/www/html/public/userfiles
      depends_on:
        - db

    db:
      image: mysql:8.4
      container_name: ${APP_NAME}-db
      restart: unless-stopped
      environment:
        MYSQL_DATABASE: leantime
        MYSQL_USER: leantime
        MYSQL_PASSWORD: ${DB_PASSWORD}
        MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      volumes:
        - leantime-db:/var/lib/mysql
  volumes:
    leantime-userfiles:
    leantime-public-userfiles:
    leantime-db:

post_install: |
  Leantime is running at http://your-server:${HTTP_PORT}

  - The install wizard runs on first load and creates your admin account.
