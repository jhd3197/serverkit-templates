id: pairdrop
name: PairDrop
version: "1.0"
description: AirDrop for the web — share files between devices on your network directly in the browser
icon: https://serverkit.ai/imgs/template-icons/pairdrop.svg
website: https://pairdrop.net
documentation: https://github.com/schlagmichdoch/PairDrop#readme
categories:
  - storage
  - sharing

variables:
  - name: HTTP_PORT
    description: Port for the PairDrop web UI (auto-assigned)
    type: port
    default: "3001"
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: PairDrop Web UI

requirements:
  memory: 128MB
  storage: 256MB

compose:
  services:
    pairdrop:
      image: lscr.io/linuxserver/pairdrop:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:3000"
      environment:
        PUID: "1000"
        PGID: "1000"
        TZ: "Etc/UTC"
  volumes: {}

post_install: |
  PairDrop is running at http://your-server:${HTTP_PORT}

  - Open it on two devices on the same network and share files directly.
