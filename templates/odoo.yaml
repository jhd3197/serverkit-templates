id: odoo
name: Odoo
version: "1.0"
description: All-in-one open-source business suite — CRM, accounting, inventory, e-commerce, HR, and 40+ apps
icon: data:image/svg+xml;base64,
website: https://www.odoo.com
documentation: https://www.odoo.com/documentation
categories:
  - business
  - erp

variables:
  - name: HTTP_PORT
    description: Port for the Odoo web UI (auto-assigned)
    type: port
    default: "8069"
    hidden: true
  - name: DB_PASSWORD
    description: PostgreSQL password
    type: password
    generate: password
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: Odoo Web UI

requirements:
  memory: 2GB
  storage: 10GB

compose:
  services:
    odoo:
      image: odoo:18
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:8069"
      environment:
        HOST: db
        USER: odoo
        PASSWORD: ${DB_PASSWORD}
      volumes:
        - odoo-web-data:/var/lib/odoo
      depends_on:
        - db

    db:
      image: postgres:16-alpine
      container_name: ${APP_NAME}-db
      restart: unless-stopped
      environment:
        POSTGRES_DB: postgres
        POSTGRES_USER: odoo
        POSTGRES_PASSWORD: ${DB_PASSWORD}
      volumes:
        - odoo-db:/var/lib/postgresql/data
  volumes:
    odoo-web-data:
    odoo-db:

post_install: |
  Odoo is running at http://your-server:${HTTP_PORT}

  - The first load shows the database creation screen — pick a master password
    and create your company database, then choose which apps to install.
