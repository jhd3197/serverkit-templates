id: flaresolverr
name: FlareSolverr
version: "1.0"
description: Proxy server that solves Cloudflare challenges — companion service for Prowlarr and the *arr stack
icon: data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+PHBhdGggZD0iTTEyIDIyczgtNCA4LTEwVjVsLTgtMy04IDN2N2MwIDYgOCAxMCA4IDEweiIvPjwvc3ZnPg==
website: https://github.com/FlareSolverr/FlareSolverr
documentation: https://github.com/FlareSolverr/FlareSolverr#readme
categories:
  - media
  - networking

variables:
  - name: HTTP_PORT
    description: Port for the FlareSolverr API (auto-assigned)
    type: port
    default: "8191"
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: FlareSolverr API

requirements:
  memory: 512MB
  storage: 1GB

compose:
  services:
    flaresolverr:
      image: ghcr.io/flaresolverr/flaresolverr:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:8191"
      environment:
        LOG_LEVEL: info
      networks:
        - default
        - media
  networks:
    media:
      name: serverkit-media

post_install: |
  FlareSolverr is running on port ${HTTP_PORT}

  - In Prowlarr, add it under Settings > Indexers > FlareSolverr with the URL
    http://${APP_NAME}:8191 (same "serverkit-media" network).
