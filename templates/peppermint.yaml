id: peppermint
name: Peppermint
version: "1.0"
description: Modern open-source ticket management and helpdesk — a lightweight Zendesk alternative
icon: data:image/svg+xml;base64,
website: https://peppermint.sh
documentation: https://docs.peppermint.sh
categories:
  - business
  - helpdesk

variables:
  - name: HTTP_PORT
    description: Port for the Peppermint web UI (auto-assigned)
    type: port
    default: "3016"
    hidden: true
  - name: DB_PASSWORD
    description: PostgreSQL password
    type: password
    generate: password
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: Peppermint Web UI

requirements:
  memory: 1GB
  storage: 2GB

compose:
  services:
    peppermint:
      image: pepperlabs/peppermint:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:3000"
        - "5003:5003"
      environment:
        DB_USERNAME: peppermint
        DB_PASSWORD: ${DB_PASSWORD}
        DB_HOST: db
      depends_on:
        - db

    db:
      image: postgres:16-alpine
      container_name: ${APP_NAME}-db
      restart: unless-stopped
      environment:
        POSTGRES_DB: peppermint
        POSTGRES_USER: peppermint
        POSTGRES_PASSWORD: ${DB_PASSWORD}
      volumes:
        - peppermint-db:/var/lib/postgresql/data
  volumes:
    peppermint-db:

post_install: |
  Peppermint is running at http://your-server:${HTTP_PORT}

  - Default login: admin@admin.com / 1234 — change it immediately.
