id: rallly
name: Rallly
version: "1.0"
description: Schedule group meetings without back-and-forth emails — an open-source Doodle alternative
icon: https://serverkit.ai/imgs/template-icons/rallly.svg
website: https://rallly.co
documentation: https://support.rallly.co/self-hosting/introduction
categories:
  - productivity
  - collaboration

variables:
  - name: HTTP_PORT
    description: Port for the Rallly web UI (auto-assigned)
    type: port
    default: "3000"
    hidden: true
  - name: SECRET_PASSWORD
    description: 32+ character secret for encrypting sessions
    type: password
    generate: password
    hidden: true
  - name: DB_PASSWORD
    description: PostgreSQL password
    type: password
    generate: password
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: Rallly Web UI

requirements:
  memory: 512MB
  storage: 1GB

compose:
  services:
    rallly:
      image: lukevella/rallly:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:3000"
      environment:
        DATABASE_URL: "postgres://rallly:${DB_PASSWORD}@db/rallly"
        SECRET_PASSWORD: ${SECRET_PASSWORD}
        NEXT_PUBLIC_BASE_URL: "http://localhost:${HTTP_PORT}"
      depends_on:
        - db

    db:
      image: postgres:14-alpine
      container_name: ${APP_NAME}-db
      restart: unless-stopped
      environment:
        POSTGRES_DB: rallly
        POSTGRES_USER: rallly
        POSTGRES_PASSWORD: ${DB_PASSWORD}
      volumes:
        - rallly-db:/var/lib/postgresql/data
  volumes:
    rallly-db:

post_install: |
  Rallly is running at http://your-server:${HTTP_PORT}

  - Configure SMTP environment variables to enable email login links; see the
    self-hosting docs for the SMTP_* settings.
