id: frigate
name: Frigate
version: "1.0"
description: Complete local NVR with realtime AI object detection for your IP cameras — no cloud required
icon: https://serverkit.ai/imgs/template-icons/frigate.svg
website: https://frigate.video
documentation: https://docs.frigate.video
categories:
  - home-automation
  - security
  - cameras

variables:
  - name: HTTP_PORT
    description: Port for the Frigate web UI (auto-assigned)
    type: port
    default: "8971"
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: Frigate Web UI
  - port: "8554"
    protocol: tcp
    description: RTSP restreaming

requirements:
  memory: 2GB
  storage: 20GB

compose:
  services:
    frigate:
      image: ghcr.io/blakeblackshear/frigate:stable
      container_name: ${APP_NAME}
      restart: unless-stopped
      shm_size: "512mb"
      ports:
        - "${HTTP_PORT}:8971"
        - "8554:8554"
        - "8555:8555/tcp"
        - "8555:8555/udp"
      volumes:
        - frigate-config:/config
        - frigate-media:/media/frigate
        - /etc/localtime:/etc/localtime:ro
      tmpfs:
        - /tmp/cache:size=1g
  volumes:
    frigate-config:
    frigate-media:

post_install: |
  Frigate is running at http://your-server:${HTTP_PORT}

  - First-run admin credentials are printed in the container logs
    (docker logs ${APP_NAME}).
  - Add your cameras in the built-in config editor (Settings > Configuration).
  - For hardware acceleration (Coral TPU / GPU), add the device mappings to the
    compose file per the Frigate docs.
