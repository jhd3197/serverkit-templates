id: linkwarden
name: Linkwarden
version: "1.0"
description: Collaborative bookmark manager that archives full copies of every page you save
icon: data:image/svg+xml;base64,
website: https://linkwarden.app
documentation: https://docs.linkwarden.app
categories:
  - productivity
  - bookmarks

variables:
  - name: HTTP_PORT
    description: Port for the Linkwarden web UI (auto-assigned)
    type: port
    default: "3000"
    hidden: true
  - name: NEXTAUTH_SECRET
    description: Secret for signing auth tokens
    type: password
    generate: password
    hidden: true
  - name: DB_PASSWORD
    description: PostgreSQL password
    type: password
    generate: password
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: Linkwarden Web UI

requirements:
  memory: 1GB
  storage: 5GB

compose:
  services:
    linkwarden:
      image: ghcr.io/linkwarden/linkwarden:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:3000"
      environment:
        NEXTAUTH_URL: "http://localhost:${HTTP_PORT}/api/v1/auth"
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
        DATABASE_URL: "postgresql://linkwarden:${DB_PASSWORD}@db:5432/linkwarden"
      volumes:
        - linkwarden-data:/data/data
      depends_on:
        - db

    db:
      image: postgres:16-alpine
      container_name: ${APP_NAME}-db
      restart: unless-stopped
      environment:
        POSTGRES_DB: linkwarden
        POSTGRES_USER: linkwarden
        POSTGRES_PASSWORD: ${DB_PASSWORD}
      volumes:
        - linkwarden-db:/var/lib/postgresql/data
  volumes:
    linkwarden-data:
    linkwarden-db:

post_install: |
  Linkwarden is running at http://your-server:${HTTP_PORT}

  - Sign up the first account to get started. Saved pages are archived as
    screenshots and PDFs automatically.
