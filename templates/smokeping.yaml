id: smokeping
name: SmokePing
version: "1.0"
description: Network latency monitoring with beautiful interactive graphs — see jitter and packet loss over time
icon: https://cdn.jsdelivr.net/gh/jhd3197/serverkit-templates@master/icons/smokeping.png
website: https://oss.oetiker.ch/smokeping/
documentation: https://oss.oetiker.ch/smokeping/doc/index.en.html
categories:
  - monitoring
  - networking

variables:
  - name: HTTP_PORT
    description: Port for the SmokePing web UI (auto-assigned)
    type: port
    default: "8115"
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: SmokePing Web UI

requirements:
  memory: 256MB
  storage: 2GB

compose:
  services:
    smokeping:
      image: lscr.io/linuxserver/smokeping:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:80"
      environment:
        PUID: "1000"
        PGID: "1000"
        TZ: "Etc/UTC"
      volumes:
        - smokeping-config:/config
        - smokeping-data:/data
  volumes:
    smokeping-config:
    smokeping-data:

post_install: |
  SmokePing is running at http://your-server:${HTTP_PORT}

  - Edit the Targets file in the config volume to add the hosts you want to
    monitor, then restart the container.
