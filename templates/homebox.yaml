id: homebox
name: HomeBox
version: "1.0"
description: Inventory and organization system for your home — track items, locations, warranties, and maintenance
icon: data:image/svg+xml;base64,
website: https://homebox.software
documentation: https://homebox.software/en/quick-start.html
categories:
  - productivity
  - home

variables:
  - name: HTTP_PORT
    description: Port for the HomeBox web UI (auto-assigned)
    type: port
    default: "7745"
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: HomeBox Web UI

requirements:
  memory: 256MB
  storage: 1GB

compose:
  services:
    homebox:
      image: ghcr.io/sysadminsmedia/homebox:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:7745"
      volumes:
        - homebox-data:/data
  volumes:
    homebox-data:

post_install: |
  HomeBox is running at http://your-server:${HTTP_PORT}

  - Register the first account to get started, then add locations and items.
