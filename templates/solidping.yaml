id: solidping
name: SolidPing
version: "0.41.0"
description: Uptime and synthetic monitoring with 40+ check types, status pages, incidents and on-call alerts.
icon: https://serverkit.ai/imgs/template-icons/solidping.svg
categories:
  - monitoring
  - devops
website: https://www.solidping.io
documentation: https://docs.solidping.io

variables:
  - name: ADMIN_PASSWORD
    type: password
    length: 32
    description: Initial administrator password (generated per installation)
  - name: HTTP_PORT
    type: port
    default: "4000"
    hidden: true
    description: Port for the web interface (auto-assigned if not specified)

compose:
  services:
    app:
      image: ghcr.io/fclairamb/solidping:0.41.0
      container_name: ${APP_NAME}
      restart: unless-stopped
      volumes:
        - data:/data

    bootstrap:
      image: python:3.12.12-alpine3.22
      restart: "no"
      environment:
        ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      command: ["python", "/bootstrap.py"]
      depends_on:
        app:
          condition: service_healthy

    web:
      image: nginx:1.28.0-alpine
      restart: unless-stopped
      ports:
        - "127.0.0.1:${HTTP_PORT}:4000"
      depends_on:
        bootstrap:
          condition: service_completed_successfully

  volumes:
    data:

files:
  - path: /bootstrap.py
    content: |
      import json
      import os
      import time
      import urllib.error
      import urllib.request

      def request(path, body):
          req = urllib.request.Request(
              "http://app:4000/api/v1/auth/" + path,
              data=json.dumps(body).encode(),
              headers={"Content-Type": "application/json", **headers},
          )
          with urllib.request.urlopen(req, timeout=15) as response:
              return json.load(response)

      headers = {}
      # On later starts, a rejected seed password means the account was already
      # secured. Never reset an operator's password on container recreation.
      for attempt in range(60):
          try:
              login = request("login", {
                  "org": "default", "email": "admin@solidping.io",
                  "password": "solidpass",
              })
              break
          except urllib.error.HTTPError as error:
              if error.code == 401:
                  print("Seed password rejected; existing credentials preserved.")
                  raise SystemExit(0)
              raise
          except urllib.error.URLError:
              if attempt == 59:
                  raise
              time.sleep(2)
      headers["Authorization"] = "Bearer " + login["accessToken"]
      request("change-password", {
          "currentPassword": "solidpass",
          "newPassword": os.environ["ADMIN_PASSWORD"],
      })
      print("Initial administrator password changed before publishing the web port.")

  - path: /etc/nginx/conf.d/default.conf
    content: |
      map $http_upgrade $connection_upgrade {
          default upgrade;
          '' close;
      }
      server {
          listen 4000;
          location / {
              proxy_pass http://app:4000;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;
              proxy_read_timeout 3600s;
          }
      }

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: Web Interface

requirements:
  memory: 256MB
  storage: 1GB

post_install: |
  SolidPing is ready through the domain assigned by ServerKit.

  Sign in with admin@solidping.io and the generated password: ${ADMIN_PASSWORD}
  The public seed password is rotated before the web port becomes available.
  Later container recreations preserve your credentials and data.

  The web port binds to localhost only; use ServerKit's HTTPS proxy.
  SQLite and uploaded files are stored in the "data" volume.
