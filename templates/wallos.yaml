id: wallos
name: Wallos
version: "1.0"
description: Personal subscription tracker — monitor recurring costs, renewal dates, and spending by category
icon: https://cdn.jsdelivr.net/gh/jhd3197/serverkit-templates@master/icons/wallos.svg
website: https://wallosapp.com
documentation: https://github.com/ellite/Wallos#readme
categories:
  - finance
  - productivity

variables:
  - name: HTTP_PORT
    description: Port for the Wallos web UI (auto-assigned)
    type: port
    default: "8282"
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: Wallos Web UI

requirements:
  memory: 256MB
  storage: 512MB

compose:
  services:
    wallos:
      image: bellamy/wallos:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:80"
      environment:
        TZ: "Etc/UTC"
      volumes:
        - wallos-db:/var/www/html/db
        - wallos-logos:/var/www/html/images/uploads/logos
  volumes:
    wallos-db:
    wallos-logos:

post_install: |
  Wallos is running at http://your-server:${HTTP_PORT}

  - Register the first user, then start adding your subscriptions.
