id: bazarr
name: Bazarr
version: "1.0"
description: Companion to Sonarr and Radarr that downloads and manages subtitles for your media library
icon: data:image/svg+xml;base64,
website: https://www.bazarr.media
documentation: https://wiki.bazarr.media
categories:
  - media
  - automation

variables:
  - name: HTTP_PORT
    description: Port for the Bazarr web UI (auto-assigned)
    type: port
    default: "6767"
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: Bazarr Web UI

requirements:
  memory: 512MB
  storage: 1GB

compose:
  services:
    bazarr:
      image: lscr.io/linuxserver/bazarr:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:6767"
      environment:
        PUID: "1000"
        PGID: "1000"
        TZ: "Etc/UTC"
      volumes:
        - bazarr-config:/config
        - bazarr-movies:/movies
        - bazarr-tv:/tv
      networks:
        - default
        - media
  volumes:
    bazarr-config:
    bazarr-movies:
    bazarr-tv:
  networks:
    media:
      name: serverkit-media

post_install: |
  Bazarr is running at http://your-server:${HTTP_PORT}

  - Connect it to Sonarr and Radarr under Settings, then enable subtitle
    providers. It shares the "serverkit-media" network with the other media apps.
