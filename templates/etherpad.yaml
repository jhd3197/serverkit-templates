id: etherpad
name: Etherpad
version: "1.0"
description: Real-time collaborative document editing in the browser — the classic shared notepad
icon: https://cdn.jsdelivr.net/gh/jhd3197/serverkit-templates@master/icons/etherpad.svg
website: https://etherpad.org
documentation: https://docs.etherpad.org
categories:
  - notes
  - collaboration

variables:
  - name: HTTP_PORT
    description: Port for the Etherpad web UI (auto-assigned)
    type: port
    default: "9001"
    hidden: true
  - name: ADMIN_PASSWORD
    description: Password for the admin interface
    type: password
    generate: password

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: Etherpad Web UI

requirements:
  memory: 512MB
  storage: 1GB

compose:
  services:
    etherpad:
      image: etherpad/etherpad:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:9001"
      environment:
        ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      volumes:
        - etherpad-data:/opt/etherpad-lite/var
  volumes:
    etherpad-data:

post_install: |
  Etherpad is running at http://your-server:${HTTP_PORT}

  - Open any URL like /p/my-pad to start a collaborative pad instantly.
  - Admin interface: /admin (user "admin" with the generated password).
