id: 2fauth
name: 2FAuth
version: "1.0"
description: Web app to manage and generate your two-factor authentication (2FA) codes — a self-hosted authenticator
icon: https://cdn.jsdelivr.net/gh/jhd3197/serverkit-templates@master/icons/2fauth.svg
website: https://docs.2fauth.app
documentation: https://docs.2fauth.app/getting-started/installation/docker/
categories:
  - security
  - authentication

variables:
  - name: HTTP_PORT
    description: Port for the 2FAuth web UI (auto-assigned)
    type: port
    default: "8092"
    hidden: true
  - name: APP_KEY
    description: 32-character encryption key
    type: password
    length: 32
    generate: password
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: 2FAuth Web UI

requirements:
  memory: 256MB
  storage: 512MB

compose:
  services:
    2fauth:
      image: 2fauth/2fauth:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:8000"
      environment:
        APP_KEY: ${APP_KEY}
        APP_URL: "http://localhost:${HTTP_PORT}"
      volumes:
        - 2fauth-data:/2fauth
  volumes:
    2fauth-data:

post_install: |
  2FAuth is running at http://your-server:${HTTP_PORT}

  - Register the first account, then import your TOTP accounts via QR codes
    or from another authenticator app.
