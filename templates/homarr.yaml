id: homarr
name: Homarr
version: "1.0"
description: Sleek customizable dashboard for your homelab with drag-and-drop widgets and app integrations
icon: https://cdn.jsdelivr.net/gh/jhd3197/serverkit-templates@master/icons/homarr.svg
website: https://homarr.dev
documentation: https://homarr.dev/docs/getting-started/
categories:
  - productivity
  - dashboard

variables:
  - name: HTTP_PORT
    description: Port for the Homarr web UI (auto-assigned)
    type: port
    default: "7575"
    hidden: true
  - name: SECRET_ENCRYPTION_KEY
    description: 64-character hex key used to encrypt stored integration secrets
    type: random
    length: 64
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: Homarr dashboard

requirements:
  memory: 512MB
  storage: 1GB

compose:
  services:
    homarr:
      image: ghcr.io/homarr-labs/homarr:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:7575"
      environment:
        SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
      volumes:
        - homarr-appdata:/appdata
        - /var/run/docker.sock:/var/run/docker.sock:ro
  volumes:
    homarr-appdata:

post_install: |
  Homarr is running at http://your-server:${HTTP_PORT}

  - Create your admin account on first load, then drag widgets onto your board.
  - The Docker socket is mounted read-only for the container integrations.
