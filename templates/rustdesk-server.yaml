id: rustdesk-server
name: RustDesk Server
version: "1.0"
description: Self-hosted signaling and relay server for RustDesk — the open-source TeamViewer alternative
icon: https://cdn.jsdelivr.net/gh/jhd3197/serverkit-templates@master/icons/rustdesk-server.svg
website: https://rustdesk.com
documentation: https://rustdesk.com/docs/en/self-host/
categories:
  - networking
  - remote-access

ports:
  - port: "21115"
    protocol: tcp
    description: NAT type test
  - port: "21116"
    protocol: tcp
    description: ID registration and heartbeat (TCP and UDP)
  - port: "21117"
    protocol: tcp
    description: Relay

requirements:
  memory: 256MB
  storage: 512MB

compose:
  services:
    hbbs:
      image: rustdesk/rustdesk-server:latest
      container_name: ${APP_NAME}-hbbs
      restart: unless-stopped
      command: hbbs
      ports:
        - "21115:21115"
        - "21116:21116"
        - "21116:21116/udp"
        - "21118:21118"
      volumes:
        - rustdesk-data:/root
      depends_on:
        - hbbr

    hbbr:
      image: rustdesk/rustdesk-server:latest
      container_name: ${APP_NAME}-hbbr
      restart: unless-stopped
      command: hbbr
      ports:
        - "21117:21117"
        - "21119:21119"
      volumes:
        - rustdesk-data:/root
  volumes:
    rustdesk-data:

post_install: |
  RustDesk server is running (fixed ports 21115-21119 — clients expect these).

  - In each RustDesk client, set the ID server to this host. The public key is
    in the rustdesk-data volume (id_ed25519.pub).
