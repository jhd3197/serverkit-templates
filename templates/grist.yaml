id: grist
name: Grist
version: "1.0"
description: Modern relational spreadsheet that combines the flexibility of a spreadsheet with the robustness of a database
icon: data:image/svg+xml;base64,
website: https://www.getgrist.com
documentation: https://support.getgrist.com/self-managed/
categories:
  - database
  - productivity
  - low-code

variables:
  - name: HTTP_PORT
    description: Port for the Grist web UI (auto-assigned)
    type: port
    default: "8484"
    hidden: true
  - name: GRIST_SESSION_SECRET
    description: Secret for signing sessions
    type: password
    generate: password
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: Grist Web UI

requirements:
  memory: 1GB
  storage: 2GB

compose:
  services:
    grist:
      image: gristlabs/grist:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:8484"
      environment:
        GRIST_SESSION_SECRET: ${GRIST_SESSION_SECRET}
        APP_HOME_URL: "http://localhost:${HTTP_PORT}"
      volumes:
        - grist-data:/persist
  volumes:
    grist-data:

post_install: |
  Grist is running at http://your-server:${HTTP_PORT}

  - Documents are stored in the grist-data volume. Configure authentication
    before exposing it publicly.
