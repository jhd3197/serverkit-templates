id: librespeed
name: LibreSpeed
version: "1.0"
description: Lightweight self-hosted speed test — measure download, upload, ping, and jitter from any browser
icon: https://serverkit.ai/imgs/template-icons/librespeed.svg
website: https://librespeed.org
documentation: https://github.com/librespeed/speedtest#readme
categories:
  - monitoring
  - networking

variables:
  - name: HTTP_PORT
    description: Port for the LibreSpeed web UI (auto-assigned)
    type: port
    default: "8086"
    hidden: true
  - name: RESULTS_PASSWORD
    description: Password for the results statistics page
    type: password
    generate: password

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: LibreSpeed Web UI

requirements:
  memory: 128MB
  storage: 256MB

compose:
  services:
    librespeed:
      image: lscr.io/linuxserver/librespeed:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:80"
      environment:
        PUID: "1000"
        PGID: "1000"
        TZ: "Etc/UTC"
        PASSWORD: ${RESULTS_PASSWORD}
      volumes:
        - librespeed-config:/config
  volumes:
    librespeed-config:

post_install: |
  LibreSpeed is running at http://your-server:${HTTP_PORT}
