id: snipe-it
name: Snipe-IT
version: "1.0"
description: IT asset management for tracking hardware, licenses, accessories, and consumables across your organization
icon: https://cdn.jsdelivr.net/gh/jhd3197/serverkit-templates@master/icons/snipe-it.png
website: https://snipeitapp.com
documentation: https://snipe-it.readme.io
categories:
  - business
  - management

variables:
  - name: HTTP_PORT
    description: Port for the Snipe-IT web UI (auto-assigned)
    type: port
    default: "8098"
    hidden: true
  - name: DB_PASSWORD
    description: MariaDB password
    type: password
    generate: password
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: Snipe-IT Web UI

requirements:
  memory: 1GB
  storage: 2GB

compose:
  services:
    snipe-it:
      image: lscr.io/linuxserver/snipe-it:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:80"
      environment:
        PUID: "1000"
        PGID: "1000"
        TZ: "Etc/UTC"
        APP_URL: "http://localhost:${HTTP_PORT}"
        MYSQL_PORT_3306_TCP_ADDR: db
        MYSQL_PORT_3306_TCP_PORT: "3306"
        MYSQL_DATABASE: snipeit
        MYSQL_USER: snipeit
        MYSQL_PASSWORD: ${DB_PASSWORD}
      volumes:
        - snipeit-config:/config
      depends_on:
        - db

    db:
      image: mariadb:11
      container_name: ${APP_NAME}-db
      restart: unless-stopped
      environment:
        MARIADB_DATABASE: snipeit
        MARIADB_USER: snipeit
        MARIADB_PASSWORD: ${DB_PASSWORD}
        MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      volumes:
        - snipeit-db:/var/lib/mysql
  volumes:
    snipeit-config:
    snipeit-db:

post_install: |
  Snipe-IT is running at http://your-server:${HTTP_PORT}

  - The pre-flight setup wizard runs on first load and creates the admin user.
