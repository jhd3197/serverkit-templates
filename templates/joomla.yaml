id: joomla
name: Joomla
version: "1.0"
description: Award-winning open-source CMS powering millions of websites, with thousands of extensions and templates
icon: data:image/svg+xml;base64,
website: https://www.joomla.org
documentation: https://docs.joomla.org
categories:
  - cms
  - website

variables:
  - name: HTTP_PORT
    description: Port for the Joomla site (auto-assigned)
    type: port
    default: "8107"
    hidden: true
  - name: DB_PASSWORD
    description: MySQL password
    type: password
    generate: password
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: Joomla site

requirements:
  memory: 512MB
  storage: 2GB

compose:
  services:
    joomla:
      image: joomla:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:80"
      environment:
        JOOMLA_DB_HOST: db
        JOOMLA_DB_USER: joomla
        JOOMLA_DB_PASSWORD: ${DB_PASSWORD}
        JOOMLA_DB_NAME: joomla
      volumes:
        - joomla-data:/var/www/html
      depends_on:
        - db

    db:
      image: mysql:8.0
      container_name: ${APP_NAME}-db
      restart: unless-stopped
      environment:
        MYSQL_DATABASE: joomla
        MYSQL_USER: joomla
        MYSQL_PASSWORD: ${DB_PASSWORD}
        MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      volumes:
        - joomla-db:/var/lib/mysql
  volumes:
    joomla-data:
    joomla-db:

post_install: |
  Joomla is running at http://your-server:${HTTP_PORT}

  - Complete the web installer — the database fields are pre-filled from the
    environment; create your admin account to finish.
