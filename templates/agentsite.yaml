id: agentsite
name: AgentSite
version: "1.0"
kind: repo
description: AI-powered website builder with multi-agent orchestration, deployed straight from its Git repository.
icon: https://serverkit.ai/imgs/template-icons/agentsite.png
categories:
  - ai
  - website
  - deployment
website: https://github.com/jhd3197/AgentSite
documentation: https://github.com/jhd3197/AgentSite#readme

# Repo templates are not one-click compose stacks — they carry a `repo` block and
# are deployed through the New Service wizard, which inspects the live repository
# for manifests. The hints below are only used as a labeled fallback when the
# public repo cannot be inspected.
repo:
  url: https://github.com/jhd3197/AgentSite.git
  branch: main
  service_name: agentsite
  app_type: docker
  build_method: dockerfile
  port: 6391
  dockerfile_path: Dockerfile
  healthcheck_path: /api/health
  strategy: serverkit
  manifest_files:
    - serverkit.yaml
    - docker-compose.yml
    - render.yaml
    - railway.json
    - app.json
  # AgentSite is model-agnostic and needs ONE provider key, not all six —
  # every key is optional so the wizard does not star them all as required.
  env:
    - key: OPENAI_API_KEY
      required: false
      secret: true
    - key: CLAUDE_API_KEY
      required: false
      secret: true
    - key: GOOGLE_API_KEY
      required: false
      secret: true
    - key: GROQ_API_KEY
      required: false
      secret: true
    - key: GROK_API_KEY
      required: false
      secret: true
    - key: OPENROUTER_API_KEY
      required: false
      secret: true

requirements:
  memory: 1GB
  storage: 4GB
