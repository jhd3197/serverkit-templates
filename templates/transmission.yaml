id: transmission
name: Transmission
version: "1.0"
description: Fast, easy, and free BitTorrent client with a lightweight web UI
icon: https://cdn.jsdelivr.net/gh/jhd3197/serverkit-templates@master/icons/transmission.svg
website: https://transmissionbt.com
documentation: https://github.com/transmission/transmission/blob/main/docs/README.md
categories:
  - media
  - downloads

variables:
  - name: HTTP_PORT
    description: Port for the Transmission web UI (auto-assigned)
    type: port
    default: "9091"
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: Transmission Web UI
  - port: "51413"
    protocol: tcp
    description: Peer port

requirements:
  memory: 256MB
  storage: 20GB

compose:
  services:
    transmission:
      image: lscr.io/linuxserver/transmission:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:9091"
        - "51413:51413"
        - "51413:51413/udp"
      environment:
        PUID: "1000"
        PGID: "1000"
        TZ: "Etc/UTC"
      volumes:
        - transmission-config:/config
        - transmission-downloads:/downloads
        - transmission-watch:/watch
      networks:
        - default
        - media
  volumes:
    transmission-config:
    transmission-downloads:
    transmission-watch:
  networks:
    media:
      name: serverkit-media

post_install: |
  Transmission is running at http://your-server:${HTTP_PORT}

  - Drop .torrent files into the watch volume for automatic pickup, or add
    them via the web UI. Shares the "serverkit-media" network.
