id: espocrm
name: EspoCRM
version: "1.0"
description: Full-featured open-source CRM — leads, opportunities, accounts, email campaigns, and workflows
icon: data:image/svg+xml;base64,
website: https://www.espocrm.com
documentation: https://docs.espocrm.com
categories:
  - business
  - crm

variables:
  - name: HTTP_PORT
    description: Port for the EspoCRM web UI (auto-assigned)
    type: port
    default: "8089"
    hidden: true
  - name: ADMIN_USERNAME
    description: Admin username
    default: "admin"
  - name: ADMIN_PASSWORD
    description: Admin password
    type: password
    generate: password
  - name: DB_PASSWORD
    description: MariaDB password
    type: password
    generate: password
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: EspoCRM Web UI

requirements:
  memory: 1GB
  storage: 2GB

compose:
  services:
    espocrm:
      image: espocrm/espocrm:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:80"
      environment:
        ESPOCRM_DATABASE_PLATFORM: Mysql
        ESPOCRM_DATABASE_HOST: db
        ESPOCRM_DATABASE_NAME: espocrm
        ESPOCRM_DATABASE_USER: espocrm
        ESPOCRM_DATABASE_PASSWORD: ${DB_PASSWORD}
        ESPOCRM_ADMIN_USERNAME: ${ADMIN_USERNAME}
        ESPOCRM_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
        ESPOCRM_SITE_URL: "http://localhost:${HTTP_PORT}"
      volumes:
        - espocrm-data:/var/www/html
      depends_on:
        - db

    db:
      image: mariadb:11
      container_name: ${APP_NAME}-db
      restart: unless-stopped
      environment:
        MARIADB_DATABASE: espocrm
        MARIADB_USER: espocrm
        MARIADB_PASSWORD: ${DB_PASSWORD}
        MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      volumes:
        - espocrm-db:/var/lib/mysql
  volumes:
    espocrm-data:
    espocrm-db:

post_install: |
  EspoCRM is running at http://your-server:${HTTP_PORT}

  - Log in with the admin credentials configured at install time.
  - If you serve it from another hostname, update ESPOCRM_SITE_URL.
