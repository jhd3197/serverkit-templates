id: it-tools
name: IT-Tools
version: "1.0"
description: Collection of 80+ handy developer tools — JWT decoder, hash generators, converters, and more, all offline
icon: https://cdn.jsdelivr.net/gh/jhd3197/serverkit-templates@master/icons/it-tools.svg
website: https://it-tools.tech
documentation: https://github.com/CorentinTh/it-tools#readme
categories:
  - development
  - productivity

variables:
  - name: HTTP_PORT
    description: Port for the IT-Tools web UI (auto-assigned)
    type: port
    default: "8090"
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: IT-Tools Web UI

requirements:
  memory: 128MB
  storage: 256MB

compose:
  services:
    it-tools:
      image: corentinth/it-tools:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:80"
  volumes: {}

post_install: |
  IT-Tools is running at http://your-server:${HTTP_PORT}
