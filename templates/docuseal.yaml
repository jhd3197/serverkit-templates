id: docuseal
name: DocuSeal
version: "1.0"
description: Open-source document signing — create fillable PDF forms and collect legally-binding e-signatures
icon: https://cdn.jsdelivr.net/gh/jhd3197/serverkit-templates@master/icons/docuseal.svg
website: https://www.docuseal.com
documentation: https://www.docuseal.com/docs
categories:
  - documents
  - business

variables:
  - name: HTTP_PORT
    description: Port for the DocuSeal web UI (auto-assigned)
    type: port
    default: "3015"
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: DocuSeal Web UI

requirements:
  memory: 512MB
  storage: 2GB

compose:
  services:
    docuseal:
      image: docuseal/docuseal:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:3000"
      volumes:
        - docuseal-data:/data
  volumes:
    docuseal-data:

post_install: |
  DocuSeal is running at http://your-server:${HTTP_PORT}

  - Create the admin account on first load, then upload a PDF and drag
    signature fields onto it to send for signing.
