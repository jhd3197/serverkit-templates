id: docmost
name: Docmost
version: "1.0"
description: Open-source collaborative wiki and documentation software — an alternative to Confluence and Notion
icon: data:image/svg+xml;base64,
website: https://docmost.com
documentation: https://docmost.com/docs/
categories:
  - documents
  - collaboration
  - wiki

variables:
  - name: HTTP_PORT
    description: Port for the Docmost web UI (auto-assigned)
    type: port
    default: "3000"
    hidden: true
  - name: APP_SECRET
    description: Secret used to sign tokens
    type: password
    generate: password
    hidden: true
  - name: DB_PASSWORD
    description: PostgreSQL password
    type: password
    generate: password
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: Docmost Web UI

requirements:
  memory: 1GB
  storage: 2GB

compose:
  services:
    docmost:
      image: docmost/docmost:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:3000"
      environment:
        APP_URL: "http://localhost:${HTTP_PORT}"
        APP_SECRET: ${APP_SECRET}
        DATABASE_URL: "postgresql://docmost:${DB_PASSWORD}@db:5432/docmost?schema=public"
        REDIS_URL: "redis://redis:6379"
      volumes:
        - docmost-storage:/app/data/storage
      depends_on:
        - db
        - redis

    db:
      image: postgres:16-alpine
      container_name: ${APP_NAME}-db
      restart: unless-stopped
      environment:
        POSTGRES_DB: docmost
        POSTGRES_USER: docmost
        POSTGRES_PASSWORD: ${DB_PASSWORD}
      volumes:
        - docmost-db:/var/lib/postgresql/data

    redis:
      image: redis:7-alpine
      container_name: ${APP_NAME}-redis
      restart: unless-stopped
  volumes:
    docmost-storage:
    docmost-db:

post_install: |
  Docmost is running at http://your-server:${HTTP_PORT}

  - Create the first workspace and admin account on first load.
