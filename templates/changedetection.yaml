id: changedetection
name: changedetection.io
version: "1.0"
description: Website change detection and monitoring with notifications to 90+ services
icon: https://cdn.jsdelivr.net/gh/jhd3197/serverkit-templates@master/icons/changedetection.svg
website: https://changedetection.io
documentation: https://github.com/dgtlmoon/changedetection.io/wiki
categories:
  - monitoring
  - automation

variables:
  - name: HTTP_PORT
    description: Port for the changedetection.io web UI (auto-assigned)
    type: port
    default: "5000"
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: changedetection.io Web UI

requirements:
  memory: 512MB
  storage: 1GB

compose:
  services:
    changedetection:
      image: dgtlmoon/changedetection.io:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:5000"
      volumes:
        - changedetection-data:/datastore
  volumes:
    changedetection-data:

post_install: |
  changedetection.io is running at http://your-server:${HTTP_PORT}

  - Add URLs to watch and hook up notifications (ntfy, Gotify, email, etc.).
  - For JavaScript-heavy sites, add a Playwright/Chrome fetcher container later.
