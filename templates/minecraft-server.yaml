id: minecraft-server
name: Minecraft Server
version: "1.0"
description: Dedicated Minecraft Java Edition server with automatic version management (itzg image)
icon: data:image/svg+xml;base64,
website: https://www.minecraft.net
documentation: https://docker-minecraft-server.readthedocs.io
categories:
  - gaming

variables:
  - name: SERVER_PORT
    description: Minecraft server port
    default: "25565"
  - name: EULA
    description: Setting TRUE means you accept the Minecraft EULA (required to run)
    options:
      - "TRUE"
      - "FALSE"
    default: "TRUE"
  - name: MEMORY
    description: JVM memory allocation
    default: "2G"
  - name: MC_VERSION
    description: Minecraft version (LATEST or a specific version like 1.21.4)
    default: "LATEST"

ports:
  - port: "${SERVER_PORT}"
    protocol: tcp
    description: Minecraft server

requirements:
  memory: 4GB
  storage: 10GB

compose:
  services:
    minecraft:
      image: itzg/minecraft-server:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${SERVER_PORT}:25565"
      environment:
        EULA: ${EULA}
        MEMORY: ${MEMORY}
        VERSION: ${MC_VERSION}
        TYPE: VANILLA
      volumes:
        - minecraft-data:/data
  volumes:
    minecraft-data:

post_install: |
  Minecraft server is starting on port ${SERVER_PORT} — the first boot
  downloads the server jar and generates the world.

  - Connect from Minecraft Java Edition using your-server:${SERVER_PORT}
  - Change TYPE (PAPER, FABRIC, FORGE...) and add mods via the environment —
    see the itzg image docs.
