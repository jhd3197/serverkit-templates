id: gitlab
name: GitLab CE
version: "1.0"
description: Complete DevOps platform — git hosting, CI/CD, issues, registry, and more (heavy, needs 4GB+ RAM)
icon: data:image/svg+xml;base64,
website: https://about.gitlab.com
documentation: https://docs.gitlab.com/ee/install/docker/
categories:
  - development
  - devops
  - git

variables:
  - name: HTTP_PORT
    description: Port for the GitLab web UI (auto-assigned)
    type: port
    default: "8929"
    hidden: true
  - name: SSH_PORT
    description: SSH port for git operations
    default: "2424"

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: GitLab Web UI
  - port: "${SSH_PORT}"
    protocol: tcp
    description: Git over SSH

requirements:
  memory: 4GB
  storage: 20GB

compose:
  services:
    gitlab:
      image: gitlab/gitlab-ce:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      shm_size: "256m"
      ports:
        - "${HTTP_PORT}:80"
        - "${SSH_PORT}:22"
      environment:
        GITLAB_OMNIBUS_CONFIG: |
          external_url 'http://localhost:${HTTP_PORT}'
          nginx['listen_port'] = 80
          gitlab_rails['gitlab_shell_ssh_port'] = ${SSH_PORT}
      volumes:
        - gitlab-config:/etc/gitlab
        - gitlab-logs:/var/log/gitlab
        - gitlab-data:/var/opt/gitlab
  volumes:
    gitlab-config:
    gitlab-logs:
    gitlab-data:

post_install: |
  GitLab is starting — first boot takes several minutes.

  - Web UI: http://your-server:${HTTP_PORT}
  - Initial root password: docker exec ${APP_NAME} cat /etc/gitlab/initial_root_password
    (valid for 24 hours — log in as "root" and change it).
