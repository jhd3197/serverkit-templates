id: lidarr
name: Lidarr
version: "1.0"
description: Music collection manager that monitors, grabs, sorts, and renames albums automatically
icon: data:image/svg+xml;base64,
website: https://lidarr.audio
documentation: https://wiki.servarr.com/lidarr
categories:
  - media
  - automation

variables:
  - name: HTTP_PORT
    description: Port for the Lidarr web UI (auto-assigned)
    type: port
    default: "8686"
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: Lidarr Web UI

requirements:
  memory: 512MB
  storage: 2GB

compose:
  services:
    lidarr:
      image: lscr.io/linuxserver/lidarr:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:8686"
      environment:
        PUID: "1000"
        PGID: "1000"
        TZ: "Etc/UTC"
      volumes:
        - lidarr-config:/config
        - lidarr-music:/music
        - lidarr-downloads:/downloads
      networks:
        - default
        - media
  volumes:
    lidarr-config:
    lidarr-music:
    lidarr-downloads:
  networks:
    media:
      name: serverkit-media

post_install: |
  Lidarr is running at http://your-server:${HTTP_PORT}

  - Add indexers via Prowlarr and a download client, then point Lidarr at them.
  - This app joins the shared "serverkit-media" network, so it can reach other
    media apps by container name.
