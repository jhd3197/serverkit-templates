id: windmill
name: Windmill
version: "1.0"
description: Developer platform to turn scripts into workflows, UIs, and scheduled jobs — an open-source Retool and Airflow alternative
icon: https://serverkit.ai/imgs/template-icons/windmill.svg
website: https://www.windmill.dev
documentation: https://www.windmill.dev/docs/intro
categories:
  - development
  - automation

variables:
  - name: HTTP_PORT
    description: Port for the Windmill web UI (auto-assigned)
    type: port
    default: "8000"
    hidden: true
  - name: DB_PASSWORD
    description: PostgreSQL password
    type: password
    generate: password
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: Windmill Web UI

requirements:
  memory: 2GB
  storage: 5GB

compose:
  services:
    windmill-server:
      image: ghcr.io/windmill-labs/windmill:main
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:8000"
      environment:
        DATABASE_URL: "postgres://windmill:${DB_PASSWORD}@db/windmill?sslmode=disable"
        MODE: server
      depends_on:
        - db

    windmill-worker:
      image: ghcr.io/windmill-labs/windmill:main
      container_name: ${APP_NAME}-worker
      restart: unless-stopped
      environment:
        DATABASE_URL: "postgres://windmill:${DB_PASSWORD}@db/windmill?sslmode=disable"
        MODE: worker
        WORKER_GROUP: default
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - windmill-worker-cache:/tmp/windmill/cache
      depends_on:
        - db

    db:
      image: postgres:16
      container_name: ${APP_NAME}-db
      restart: unless-stopped
      environment:
        POSTGRES_DB: windmill
        POSTGRES_USER: windmill
        POSTGRES_PASSWORD: ${DB_PASSWORD}
      volumes:
        - windmill-db:/var/lib/postgresql/data
  volumes:
    windmill-worker-cache:
    windmill-db:

post_install: |
  Windmill is running at http://your-server:${HTTP_PORT}

  - Default login: admin@windmill.dev / changeme — change it immediately.
  - Add more worker containers to scale job throughput.
