id: element
name: Element
version: "1.0"
description: Glossy Matrix web client — secure decentralized chat with E2E encryption
icon: data:image/svg+xml;base64,
website: https://element.io
documentation: https://github.com/element-hq/element-web#readme
categories:
  - collaboration
  - chat

variables:
  - name: HTTP_PORT
    description: Port for the Element web app (auto-assigned)
    type: port
    default: "8096"
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: Element Web

requirements:
  memory: 128MB
  storage: 256MB

compose:
  services:
    element:
      image: vectorim/element-web:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:80"
  volumes: {}

post_install: |
  Element is running at http://your-server:${HTTP_PORT}

  - Sign in with any Matrix account. Pair it with the Matrix Synapse template
    to run your own homeserver.
