id: nocodb
name: NocoDB
version: "1.0"
description: Open-source Airtable alternative — turns any database into a smart spreadsheet with forms, kanban, and APIs
icon: https://cdn.jsdelivr.net/gh/jhd3197/serverkit-templates@master/icons/nocodb.svg
website: https://nocodb.com
documentation: https://docs.nocodb.com
categories:
  - database
  - productivity
  - low-code

variables:
  - name: HTTP_PORT
    description: Port for the NocoDB web UI (auto-assigned)
    type: port
    default: "8080"
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: NocoDB Web UI

requirements:
  memory: 512MB
  storage: 2GB

compose:
  services:
    nocodb:
      image: nocodb/nocodb:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:8080"
      volumes:
        - nocodb-data:/usr/app/data
  volumes:
    nocodb-data:

post_install: |
  NocoDB is running at http://your-server:${HTTP_PORT}

  - Sign up the first user (becomes super admin). Uses built-in SQLite by
    default; connect external databases from the UI.
