id: thelounge
name: The Lounge
version: "1.0"
description: Modern always-on web IRC client — stay connected and never miss a message
icon: data:image/svg+xml;base64,
website: https://thelounge.chat
documentation: https://thelounge.chat/docs
categories:
  - collaboration
  - chat

variables:
  - name: HTTP_PORT
    description: Port for The Lounge web UI (auto-assigned)
    type: port
    default: "9000"
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: The Lounge Web UI

requirements:
  memory: 256MB
  storage: 1GB

compose:
  services:
    thelounge:
      image: thelounge/thelounge:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:9000"
      volumes:
        - thelounge-data:/var/opt/thelounge
  volumes:
    thelounge-data:

post_install: |
  The Lounge is running at http://your-server:${HTTP_PORT}

  - Create your user first:
    docker exec -it ${APP_NAME} thelounge add <username>
    (it prompts for a password), then log in and add your IRC networks.
