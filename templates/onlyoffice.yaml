id: onlyoffice
name: ONLYOFFICE Docs
version: "1.0"
description: Office suite server for collaborative editing of documents, spreadsheets, and presentations — integrates with Nextcloud and Seafile
icon: data:image/svg+xml;base64,
website: https://www.onlyoffice.com
documentation: https://helpcenter.onlyoffice.com/installation/docs-community-index.aspx
categories:
  - documents
  - collaboration

variables:
  - name: HTTP_PORT
    description: Port for the ONLYOFFICE document server (auto-assigned)
    type: port
    default: "8113"
    hidden: true
  - name: JWT_SECRET
    description: Secret for signing editor requests
    type: password
    generate: password

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: ONLYOFFICE Docs

requirements:
  memory: 4GB
  storage: 5GB

compose:
  services:
    onlyoffice:
      image: onlyoffice/documentserver:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:80"
      environment:
        JWT_ENABLED: "true"
        JWT_SECRET: ${JWT_SECRET}
      volumes:
        - onlyoffice-data:/var/www/onlyoffice/Data
        - onlyoffice-logs:/var/log/onlyoffice
  volumes:
    onlyoffice-data:
    onlyoffice-logs:

post_install: |
  ONLYOFFICE Docs is running at http://your-server:${HTTP_PORT}

  - Connect it from Nextcloud (ONLYOFFICE app) or Seafile using this URL and
    the JWT secret configured at install time.
