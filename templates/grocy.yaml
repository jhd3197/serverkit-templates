id: grocy
name: Grocy
version: "1.0"
description: ERP for your fridge — groceries, chores, and household management with stock tracking and barcode support
icon: data:image/svg+xml;base64,
website: https://grocy.info
documentation: https://github.com/grocy/grocy#readme
categories:
  - productivity
  - home

variables:
  - name: HTTP_PORT
    description: Port for the Grocy web UI (auto-assigned)
    type: port
    default: "9283"
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: Grocy Web UI

requirements:
  memory: 256MB
  storage: 512MB

compose:
  services:
    grocy:
      image: lscr.io/linuxserver/grocy:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:80"
      environment:
        PUID: "1000"
        PGID: "1000"
        TZ: "Etc/UTC"
      volumes:
        - grocy-config:/config
  volumes:
    grocy-config:

post_install: |
  Grocy is running at http://your-server:${HTTP_PORT}

  - Default login: admin / admin — change it immediately.
