id: matomo
name: Matomo
version: "1.0"
description: Google Analytics alternative that protects your data and your customers' privacy
icon: https://cdn.jsdelivr.net/gh/jhd3197/serverkit-templates@master/icons/matomo.svg
website: https://matomo.org
documentation: https://matomo.org/guides/
categories:
  - analytics
  - privacy

variables:
  - name: HTTP_PORT
    description: Port for the Matomo web UI (auto-assigned)
    type: port
    default: "8087"
    hidden: true
  - name: DB_PASSWORD
    description: MariaDB password for the matomo user
    type: password
    generate: password

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: Matomo Web UI

requirements:
  memory: 1GB
  storage: 4GB

compose:
  services:
    matomo:
      image: matomo:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:80"
      environment:
        MATOMO_DATABASE_HOST: db
        MATOMO_DATABASE_ADAPTER: mysql
        MATOMO_DATABASE_USERNAME: matomo
        MATOMO_DATABASE_PASSWORD: ${DB_PASSWORD}
        MATOMO_DATABASE_DBNAME: matomo
      volumes:
        - matomo-data:/var/www/html
      depends_on:
        - db

    db:
      image: mariadb:11
      container_name: ${APP_NAME}-db
      restart: unless-stopped
      command: --max-allowed-packet=64MB
      environment:
        MARIADB_DATABASE: matomo
        MARIADB_USER: matomo
        MARIADB_PASSWORD: ${DB_PASSWORD}
        MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      volumes:
        - matomo-db:/var/lib/mysql
  volumes:
    matomo-data:
    matomo-db:

post_install: |
  Matomo is running at http://your-server:${HTTP_PORT}

  - Complete the installer in the browser — the database fields are pre-filled
    from the environment; just click through and create your admin user.
