id: monica
name: Monica
version: "1.0"
description: Personal CRM to remember everything about your friends, family, and business relationships
icon: data:image/svg+xml;base64,
website: https://www.monicahq.com
documentation: https://github.com/monicahq/monica/blob/main/docs/installation/providers/docker.md
categories:
  - productivity
  - crm

variables:
  - name: HTTP_PORT
    description: Port for the Monica web UI (auto-assigned)
    type: port
    default: "8101"
    hidden: true
  - name: APP_KEY
    description: 32-character encryption key
    type: password
    length: 32
    generate: password
    hidden: true
  - name: DB_PASSWORD
    description: MySQL password
    type: password
    generate: password
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: Monica Web UI

requirements:
  memory: 512MB
  storage: 2GB

compose:
  services:
    monica:
      image: monica:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:80"
      environment:
        APP_KEY: ${APP_KEY}
        APP_ENV: production
        APP_URL: "http://localhost:${HTTP_PORT}"
        DB_HOST: db
        DB_DATABASE: monica
        DB_USERNAME: monica
        DB_PASSWORD: ${DB_PASSWORD}
      volumes:
        - monica-data:/var/www/html/storage
      depends_on:
        - db

    db:
      image: mysql:8.0
      container_name: ${APP_NAME}-db
      restart: unless-stopped
      environment:
        MYSQL_DATABASE: monica
        MYSQL_USER: monica
        MYSQL_PASSWORD: ${DB_PASSWORD}
        MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      volumes:
        - monica-db:/var/lib/mysql
  volumes:
    monica-data:
    monica-db:

post_install: |
  Monica is running at http://your-server:${HTTP_PORT}

  - Register the first account to get started.
