id: pingvin-share
name: Pingvin Share
version: "1.0"
description: Self-hosted file sharing platform — a WeTransfer alternative with links, expiry, and password protection
icon: https://cdn.jsdelivr.net/gh/jhd3197/serverkit-templates@master/icons/pingvin-share.svg
website: https://github.com/stonith404/pingvin-share
documentation: https://stonith404.github.io/pingvin-share/
categories:
  - storage
  - sharing

variables:
  - name: HTTP_PORT
    description: Port for the Pingvin Share web UI (auto-assigned)
    type: port
    default: "3000"
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: Pingvin Share Web UI

requirements:
  memory: 512MB
  storage: 10GB

compose:
  services:
    pingvin-share:
      image: stonith404/pingvin-share:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:3000"
      volumes:
        - pingvin-data:/opt/app/backend/data
        - pingvin-images:/opt/app/frontend/public/img
  volumes:
    pingvin-data:
    pingvin-images:

post_install: |
  Pingvin Share is running at http://your-server:${HTTP_PORT}

  - The first registered account becomes the admin.
