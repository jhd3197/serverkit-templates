id: esphome
name: ESPHome
version: "1.0"
description: Create custom firmwares for ESP32/ESP8266 smart-home devices with simple YAML configuration
icon: data:image/svg+xml;base64,
website: https://esphome.io
documentation: https://esphome.io/guides/getting_started_command_line.html
categories:
  - home-automation
  - iot

variables:
  - name: HTTP_PORT
    description: Port for the ESPHome dashboard (auto-assigned)
    type: port
    default: "6052"
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: ESPHome dashboard

requirements:
  memory: 1GB
  storage: 4GB

compose:
  services:
    esphome:
      image: esphome/esphome:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:6052"
      volumes:
        - esphome-config:/config
  volumes:
    esphome-config:

post_install: |
  ESPHome is running at http://your-server:${HTTP_PORT}

  - Flash devices over the network (OTA) or via the browser's serial support.
  - For USB flashing from the server itself, add a device mapping to the
    compose file (e.g. /dev/ttyUSB0).
