id: kanboard
name: Kanboard
version: "1.0"
description: Minimalist kanban project management — simple, fast, and self-contained
icon: data:image/svg+xml;base64,
website: https://kanboard.org
documentation: https://docs.kanboard.org
categories:
  - productivity
  - collaboration

variables:
  - name: HTTP_PORT
    description: Port for the Kanboard web UI (auto-assigned)
    type: port
    default: "8100"
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: Kanboard Web UI

requirements:
  memory: 256MB
  storage: 1GB

compose:
  services:
    kanboard:
      image: kanboard/kanboard:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:80"
      volumes:
        - kanboard-data:/var/www/app/data
        - kanboard-plugins:/var/www/app/plugins
  volumes:
    kanboard-data:
    kanboard-plugins:

post_install: |
  Kanboard is running at http://your-server:${HTTP_PORT}

  - Default login: admin / admin — change it immediately.
