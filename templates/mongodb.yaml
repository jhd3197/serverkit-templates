id: mongodb
name: MongoDB
version: "1.0"
description: Popular document database for modern applications — flexible JSON-like storage with powerful queries
icon: data:image/svg+xml;base64,
website: https://www.mongodb.com
documentation: https://www.mongodb.com/docs/
categories:
  - database
  - development

variables:
  - name: DB_PORT
    description: Port MongoDB listens on (auto-assigned)
    type: port
    default: "27017"
    hidden: true
  - name: MONGO_USER
    description: Root user name
    default: "root"
  - name: MONGO_PASSWORD
    description: Root password
    type: password
    generate: password

ports:
  - port: "${DB_PORT}"
    protocol: tcp
    description: MongoDB

requirements:
  memory: 1GB
  storage: 5GB

compose:
  services:
    mongodb:
      image: mongo:8
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${DB_PORT}:27017"
      environment:
        MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
        MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      volumes:
        - mongodb-data:/data/db
  volumes:
    mongodb-data:

post_install: |
  MongoDB 8 is running on port ${DB_PORT}

  - Connect: mongodb://${MONGO_USER}:<password>@your-server:${DB_PORT}/
  - Pair it with Mongo Express (template) for a web admin UI.
