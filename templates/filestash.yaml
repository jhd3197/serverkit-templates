id: filestash
name: Filestash
version: "1.0"
description: Modern web file manager that connects to SFTP, S3, FTP, WebDAV, Git, and more — a Dropbox-like UI over your existing storage
icon: data:image/svg+xml;base64,
website: https://www.filestash.app
documentation: https://www.filestash.app/docs/
categories:
  - storage
  - productivity

variables:
  - name: HTTP_PORT
    description: Port for the Filestash web UI (auto-assigned)
    type: port
    default: "8334"
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: Filestash Web UI

requirements:
  memory: 512MB
  storage: 1GB

compose:
  services:
    filestash:
      image: machines/filestash:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:8334"
      volumes:
        - filestash-data:/app/data/state
  volumes:
    filestash-data:

post_install: |
  Filestash is running at http://your-server:${HTTP_PORT}

  - Open /admin to set the admin console password and configure your storage
    backends (SFTP, S3, FTP, WebDAV, ...).
