id: shlink
name: Shlink
version: "1.0"
description: Self-hosted URL shortener with detailed visit analytics, QR codes, and a full REST API
icon: https://cdn.jsdelivr.net/gh/jhd3197/serverkit-templates@master/icons/shlink.svg
website: https://shlink.io
documentation: https://shlink.io/documentation/
categories:
  - productivity
  - networking

variables:
  - name: HTTP_PORT
    description: Port for the Shlink API and redirects (auto-assigned)
    type: port
    default: "8112"
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: Shlink short URLs and REST API

requirements:
  memory: 512MB
  storage: 1GB

compose:
  services:
    shlink:
      image: shlinkio/shlink:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:8080"
      environment:
        DEFAULT_DOMAIN: "localhost:${HTTP_PORT}"
        IS_HTTPS_ENABLED: "false"
      volumes:
        - shlink-data:/etc/shlink/data
  volumes:
    shlink-data:

post_install: |
  Shlink is running at http://your-server:${HTTP_PORT}

  - Generate an API key: docker exec ${APP_NAME} shlink api-key:generate
  - Use the key with the REST API, CLI, or pair it with the shlink-web-client
    UI. Update DEFAULT_DOMAIN when you attach a real domain.
