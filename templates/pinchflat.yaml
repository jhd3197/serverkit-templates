id: pinchflat
name: Pinchflat
version: "1.0"
description: Your own YouTube media manager — auto-download channels and playlists for Plex and Jellyfin
icon: https://cdn.jsdelivr.net/gh/jhd3197/serverkit-templates@master/icons/pinchflat.png
website: https://github.com/kieraneglin/pinchflat
documentation: https://github.com/kieraneglin/pinchflat/wiki
categories:
  - media
  - downloads

variables:
  - name: HTTP_PORT
    description: Port for the Pinchflat web UI (auto-assigned)
    type: port
    default: "8945"
    hidden: true

ports:
  - port: "${HTTP_PORT}"
    protocol: http
    description: Pinchflat Web UI

requirements:
  memory: 512MB
  storage: 20GB

compose:
  services:
    pinchflat:
      image: ghcr.io/kieraneglin/pinchflat:latest
      container_name: ${APP_NAME}
      restart: unless-stopped
      ports:
        - "${HTTP_PORT}:8945"
      environment:
        TZ: "Etc/UTC"
      volumes:
        - pinchflat-config:/config
        - pinchflat-downloads:/downloads
      networks:
        - default
        - media
  volumes:
    pinchflat-config:
    pinchflat-downloads:
  networks:
    media:
      name: serverkit-media

post_install: |
  Pinchflat is running at http://your-server:${HTTP_PORT}

  - Add channels or playlists as sources and pick quality profiles; media
    lands in the pinchflat-downloads volume, ready for Plex or Jellyfin.
